<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NCLEX">
<meta name="theme-color" content="#0f766e">
<title>Ri's NCLEX study</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<style>:root{
  --bg:#f4f6f8;--card:#fff;--ink:#18212c;--soft:#566273;--line:#d9dfe7;--accent:#0f766e;--accent-ink:#fff;
  --tint:#e6f4f2;--ok:#15803d;--bad:#b42318;--warn:#a15c07;--warn-bg:#fff6e5;--bad-bg:#fdecea;--ok-bg:#e8f6ec;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#10151b;--card:#1a212b;--ink:#e7ecf2;--soft:#9aa7b8;--line:#2d3744;--accent:#2bb5a8;--accent-ink:#06211f;
  --tint:#17302f;--ok:#5ad08a;--bad:#ff8a7a;--warn:#f2b653;--warn-bg:#33290f;--bad-bg:#3a1b17;--ok-bg:#15301f;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  padding-top:env(safe-area-inset-top);padding-bottom:calc(76px + env(safe-area-inset-bottom))}
main{max-width:720px;margin:0 auto;padding:14px 16px 24px}
h1{font-size:24px;line-height:1.25;margin:6px 0 4px}
h2{font-size:19px;margin:22px 0 8px}
h3{font-size:16px;margin:14px 0 6px}
p{margin:8px 0}
.soft{color:var(--soft)}.small{font-size:14.5px}.center{text-align:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:10px 0}
.card.tint{background:var(--tint);border-color:transparent}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.grow{flex:1;min-width:0}
button,.btn{font:inherit;font-weight:600;border:0;border-radius:12px;padding:13px 16px;background:var(--accent);color:var(--accent-ink);
  width:100%;min-height:48px;cursor:pointer;text-align:center;display:block;text-decoration:none}
button.ghost,.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
button.plain{background:transparent;color:var(--accent);width:auto;padding:8px 10px;min-height:40px}
button.sm{width:auto;padding:9px 14px;min-height:40px;font-size:15.5px}
button:disabled{opacity:.45}
.stack>*+*{margin-top:10px}
.pill{display:inline-block;font-size:13px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--tint);color:var(--accent);white-space:nowrap}
.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.bad{background:var(--bad-bg);color:var(--bad)}
.big{font-size:44px;font-weight:700;line-height:1.1}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav.tabs a{flex:1;text-align:center;font-size:12.5px;color:var(--soft);text-decoration:none;padding:6px 2px;border-radius:10px}
nav.tabs a b{display:block;font-size:20px;line-height:1.2;font-weight:400}
nav.tabs a.on{color:var(--accent);font-weight:600}
.bar{position:sticky;top:0;z-index:4;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;
  gap:10px;align-items:center;justify-content:space-between;font-weight:600}
.bar .t{font-variant-numeric:tabular-nums}
.q{scroll-margin-top:64px}
.q .num{font-weight:700;color:var(--accent)}
.stem{white-space:pre-wrap}
.case{background:var(--tint);border-radius:10px;padding:10px 12px;white-space:pre-wrap;font-size:16px;margin:8px 0}
details.case summary{font-weight:600;cursor:pointer}
label.opt{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1.5px solid var(--line);border-radius:12px;margin:8px 0;cursor:pointer}
label.opt input{width:22px;height:22px;margin:2px 0 0;flex:none;accent-color:var(--accent)}
label.opt.on{border-color:var(--accent);background:var(--tint)}
.matrix{width:100%;border-collapse:collapse;font-size:16px}
.matrix th,.matrix td{border-bottom:1px solid var(--line);padding:10px 6px;text-align:left;vertical-align:middle}
.matrix th.c,.matrix td.c{text-align:center;width:64px}
.matrix input{width:22px;height:22px;accent-color:var(--accent)}
select,input[type=text],input[type=date],textarea{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:10px;max-width:100%}
input[type=text].num{width:150px;font-size:19px}
textarea{width:100%;min-height:110px;font-size:16px;font-family:ui-monospace,Menlo,monospace}
.cloze select{margin:4px 2px}
.grp{margin:12px 0}.grp h4{margin:0 0 2px;font-size:15px;letter-spacing:.03em}
.meter{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.right{color:var(--ok);font-weight:600}.wrong{color:var(--bad);font-weight:600}.part{color:var(--warn);font-weight:600}
.why{border-left:3px solid var(--accent);padding:2px 0 2px 12px;margin:10px 0;white-space:pre-wrap}
.flash{min-height:230px;display:flex;flex-direction:column;justify-content:center;text-align:center;cursor:pointer}
.flash .front{font-size:21px;font-weight:650}
.flash .back{white-space:pre-wrap;margin-top:14px;text-align:left}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13.5px;padding:4px 9px;border-radius:8px;border:1px solid var(--line);color:var(--soft)}
.chip.done{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:99px;font-size:15px;z-index:9;max-width:90%}
table.plain{width:100%;border-collapse:collapse;font-size:15.5px}
table.plain td,table.plain th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.plain td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
svg.chart{width:100%;height:auto;display:block}
a{color:var(--accent)}

/* learning features */
.steps3 .st{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.steps3 .st:last-child{border-bottom:0}
.steps3 .dot{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--accent);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700}
.steps3 .dot.done{background:var(--accent);color:var(--accent-ink)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.btnrow button{flex:1;min-width:120px}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--card);border-top:2px solid var(--accent);border-radius:16px 16px 0 0;padding:8px 12px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -6px 24px rgba(0,0,0,.25)}
.pad{border:1.5px dashed var(--line);border-radius:12px;background:var(--bg);touch-action:none;display:block;width:100%;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.cols{display:grid;gap:10px}
.cols.c2{grid-template-columns:1fr 1fr}.cols.c3{grid-template-columns:1fr 1fr 1fr}
.col{border-radius:12px;padding:10px;background:var(--tint)}
.col h4{margin:0 0 8px;font-size:14.5px;line-height:1.3}
.col .it{background:var(--card);border-radius:8px;padding:7px 9px;margin:6px 0;font-size:15px}
.col.k0{background:var(--tint)}.col.k1{background:var(--warn-bg)}.col.k2{background:var(--ok-bg)}
.ladder .rung{display:flex;gap:10px;align-items:center;background:var(--tint);border-radius:10px;padding:10px 12px;margin:6px 0}
.ladder .rung b{flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-size:14px}
.ladder .arrow{text-align:center;color:var(--soft);line-height:1}
.hook{font-size:19px;font-weight:650;margin:10px 0}
.sortrow{border:1.5px solid var(--line);border-radius:12px;padding:10px;margin:8px 0}
.sortrow.ok{border-color:var(--ok);background:var(--ok-bg)}.sortrow.no{border-color:var(--bad);background:var(--bad-bg)}
.pick{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pick button{width:auto;flex:1;min-height:42px;padding:8px 10px;font-size:15px;background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.pick button.on{background:var(--accent);color:var(--accent-ink)}
.chiprow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chiprow button{width:auto;min-height:36px;padding:6px 10px;font-size:14px;background:transparent;color:var(--soft);border:1px solid var(--line);font-weight:500}
.chiprow button.on{background:var(--tint);color:var(--accent);border-color:var(--accent);font-weight:600}
.fb{border-radius:12px;padding:12px;margin:10px 0}.fb.ok{background:var(--ok-bg)}.fb.no{background:var(--bad-bg)}.fb.mid{background:var(--warn-bg)}
.onb{min-height:70vh;display:flex;flex-direction:column;justify-content:center}
.onb .n{font-size:15px;color:var(--soft)}
.onb h1{font-size:28px}

.sheet .row span{display:flex;gap:4px}

.tooltab.on{background:var(--tint);border-radius:10px}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.keys button{min-height:44px;padding:8px;font-size:18px}
</style>
</head>
<body>
<main><p style="padding:24px">Loading your study record…</p></main>
<nav class="tabs" aria-label="Sections"></nav>
<noscript><p style="padding:24px">This page needs JavaScript turned on.</p></noscript>
<script src="data.js"></script>
<script>/* Scoring, result codes and adaptive routing. Pure functions: the app and Nova's
   ingest tool both use this file, so a set is always marked the same way. */
(function (root) {
  'use strict';

  var uniq = function (a) { return a.filter(function (x, i) { return a.indexOf(x) === i; }); };

  function parseNumber(s) {
    if (s === null || s === undefined) return null;
    var m = String(s).replace(/,/g, '').match(/-?\d*\.?\d+/);
    return m ? parseFloat(m[0]) : null;
  }

  function isAnswered(item, r) {
    if (r === null || r === undefined) return false;
    switch (item.type) {
      case 'single': return typeof r === 'string' && r !== '';
      case 'multi': return Array.isArray(r) && r.length > 0;
      case 'matrix': return item.rows.every(function (row) { return r[row.k]; });
      case 'cloze': return item.blanks.every(function (b, i) { return r[i]; });
      case 'bowtie': return item.groups.every(function (g, i) { return r[i] && r[i].length === g.pick; });
      case 'numeric': return parseNumber(r) !== null;
    }
    return false;
  }

  /* Points for one item, 0 to 1. Rules are the ones printed on Ri's sets. */
  function score(item, r) {
    if (r === null || r === undefined) return 0;
    switch (item.type) {
      case 'single':
        return r === item.ans[0] ? 1 : 0;
      case 'multi': {
        var picks = uniq(Array.isArray(r) ? r : []);
        var right = picks.filter(function (k) { return item.ans.indexOf(k) >= 0; }).length;
        var wrong = picks.length - right;
        return Math.max(0, (right - wrong) / item.ans.length);
      }
      case 'matrix': {
        var ok = item.rows.filter(function (row) { return r[row.k] === row.ans; }).length;
        return ok / item.rows.length;
      }
      case 'cloze': {
        var okb = item.blanks.filter(function (b, i) { return r[i] === b.ans; }).length;
        return okb / item.blanks.length;
      }
      case 'bowtie': {
        var total = 0, got = 0;
        item.groups.forEach(function (g, i) {
          total += g.ans.length;
          var p = uniq((r[i] || []).slice(0, g.pick));
          got += p.filter(function (k) { return g.ans.indexOf(k) >= 0; }).length;
        });
        return total ? got / total : 0;
      }
      case 'numeric': {
        var v = parseNumber(r);
        if (v === null) return 0;
        var targets = [item.ans].concat(item.accept || []);
        var tol = item.tol || 0;
        return targets.some(function (t) { return Math.abs(v - t) <= tol + 1e-9; }) ? 1 : 0;
      }
    }
    return 0;
  }

  /* For a wrong numeric answer: the trap she fell into, if the key names it. */
  function trapFor(item, r) {
    if (item.type !== 'numeric' || !item.traps) return null;
    var v = parseNumber(r);
    if (v === null) return null;
    for (var i = 0; i < item.traps.length; i++) {
      if (Math.abs(v - item.traps[i].v) <= 1e-9) return item.traps[i].why;
    }
    return null;
  }

  /* One response as a short string, for the result code and for display. */
  function encodeResp(item, r) {
    if (r === null || r === undefined) return '';
    switch (item.type) {
      case 'single': return r;
      case 'multi': return r.slice().sort().join(',');
      case 'matrix': return item.rows.map(function (row) { return r[row.k] || '-'; }).join(',');
      case 'cloze': return item.blanks.map(function (b, i) { return r[i] || '-'; }).join(',');
      case 'bowtie': return item.groups.map(function (g, i) { return (r[i] || []).slice().sort().join(','); }).join(';');
      case 'numeric': return String(r).trim();
    }
    return '';
  }

  function decodeResp(item, s) {
    if (s === '' || s === null || s === undefined) return null;
    switch (item.type) {
      case 'single': return s;
      case 'multi': return s.split(',').filter(Boolean);
      case 'matrix': { var o = {}; s.split(',').forEach(function (v, i) { if (v !== '-' && item.rows[i]) o[item.rows[i].k] = v; }); return o; }
      case 'cloze': return s.split(',').map(function (v) { return v === '-' ? null : v; });
      case 'bowtie': return s.split(';').map(function (g) { return g.split(',').filter(Boolean); });
      case 'numeric': return s;
    }
    return null;
  }

  /* The correct answer as text she can read. */
  function answerText(item) {
    var opt = function (opts, k) { var o = (opts || []).filter(function (x) { return x.k === k; })[0]; return o ? k + '. ' + o.t : k; };
    switch (item.type) {
      case 'single':
      case 'multi': return item.ans.map(function (k) { return opt(item.opts, k); }).join('\n');
      case 'matrix': return item.rows.map(function (row) {
        var c = item.cols.filter(function (x) { return x.k === row.ans; })[0];
        return row.t + ': ' + (c ? c.t : row.ans);
      }).join('\n');
      case 'cloze': return item.blanks.map(function (b, i) {
        var o = b.opts.filter(function (x) { return x.k === b.ans; })[0];
        return 'Blank ' + (i + 1) + ': ' + (o ? o.t : b.ans);
      }).join('\n');
      case 'bowtie': return item.groups.map(function (g) {
        return g.name + ': ' + g.ans.map(function (k) { var o = g.opts.filter(function (x) { return x.k === k; })[0]; return o ? o.t : k; }).join('; ');
      }).join('\n');
      case 'numeric': return item.ans + (item.unit ? ' ' + item.unit : '');
    }
    return '';
  }

  /* Mark a whole attempt. answers: {itemId: response}. */
  function markAttempt(items, answers) {
    var out = { score: 0, max: items.length, per: {}, byCat: {}, byType: {}, missed: [], partial: [], blank: [] };
    items.forEach(function (it) {
      var r = answers[it.id];
      var answered = isAnswered(it, r) || (it.type === 'multi' && Array.isArray(r) && r.length > 0);
      var pts = score(it, r);
      out.per[it.id] = pts;
      out.score += pts;
      var add = function (bag, key) {
        if (!bag[key]) bag[key] = { score: 0, max: 0 };
        bag[key].score += pts; bag[key].max += 1;
      };
      add(out.byCat, it.cat || 'Uncategorised');
      add(out.byType, it.type === 'multi' ? 'Select-all' : it.calc ? 'Calculation' : it.type === 'single' ? 'Single answer' : 'Next-Gen (matrix, cloze, bow-tie)');
      if (it.calc && it.type === 'multi') add(out.byType, 'Calculation');
      var blank = r === null || r === undefined || r === '' || (Array.isArray(r) && r.length === 0);
      if (blank) out.blank.push(it.id);
      else if (pts === 0) out.missed.push(it.id);
      else if (pts < 1) out.partial.push(it.id);
    });
    out.pct = out.max ? Math.round(1000 * out.score / out.max) / 10 : 0;
    return out;
  }

  /* Result code: what she sends to Nova so the record there stays complete. */
  function b64uEncode(str) {
    var b = (typeof btoa === 'function') ? btoa(unescape(encodeURIComponent(str))) : Buffer.from(str, 'utf8').toString('base64');
    return b.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  function b64uDecode(s) {
    s = s.replace(/-/g, '+').replace(/_/g, '/');
    while (s.length % 4) s += '=';
    return (typeof atob === 'function') ? decodeURIComponent(escape(atob(s))) : Buffer.from(s, 'base64').toString('utf8');
  }
  function encodeResult(attempt, itemsById) {
    var a = {};
    Object.keys(attempt.answers).forEach(function (id) {
      var it = itemsById[id];
      if (it) { var e = encodeResp(it, attempt.answers[id]); if (e !== '') a[id] = e; }
    });
    var body = { v: 1, s: attempt.set, m: attempt.mode, t: attempt.finished, d: attempt.secs, o: attempt.order || null, a: a };
    body.p = attempt.pct;                               // her phone's own mark, to spot a bank that differs
    if (attempt.of) body.r = attempt.of;                // what a retry or mix was built from
    if (attempt.days) body.g = attempt.days;            // topic days she has done
    if (attempt.why && Object.keys(attempt.why).length) body.w = attempt.why;   // why she thinks she missed each: k didn't know, m misread, s slip, g guessed
    if (attempt.note) body.n = String(attempt.note).slice(0, 600);                // the rule in her own words
    if (attempt.changes && Object.keys(attempt.changes).length) body.c = attempt.changes;   // how many times she changed each answer
    if (attempt.unsure && attempt.unsure.length) body.u = attempt.unsure;                    // questions she marked "not sure"
    if (attempt.feel) body.f = attempt.feel;            // how the set felt: easy | right | hard
    if (attempt.short) body.k = 1;                      // she chose the short version
    if (attempt.adaptive && attempt.adaptive.v === 2) body.ad = { w: attempt.adaptive.why || null, u: attempt.adaptive.unmet || null, b: attempt.adaptive.unbalanced ? 1 : 0, s: attempt.adaptive.short || null };   // why a v2 test ended
    if (attempt.times) body.x = attempt.times;          // seconds per question, one-at-a-time modes only
    return 'RS1.' + b64uEncode(JSON.stringify(body));
  }
  function decodeResult(code, itemsById) {
    var m = String(code).match(/RS1\.([A-Za-z0-9_-]+)/);
    if (!m) throw new Error('No result code found');
    var body = JSON.parse(b64uDecode(m[1]));
    if (body.v !== 1) throw new Error('Unknown result version');
    var answers = {};
    Object.keys(body.a).forEach(function (id) {
      if (itemsById[id]) answers[id] = decodeResp(itemsById[id], body.a[id]);
    });
    return { set: body.s, mode: body.m, finished: body.t, secs: body.d, order: body.o, answers: answers, pct: body.p, of: body.r || null, days: body.g || null, why: body.w || null, note: body.n || null, changes: body.c || null, unsure: body.u || null, feel: body.f || null, short: !!body.k, times: body.x || null, adaptiveEnd: body.ad ? { why: body.ad.w, unmet: body.ad.u, unbalanced: !!body.ad.b, short: body.ad.s || null } : null };
  }

  /* Adaptive test. Rules are the routing note in the adaptive bank:
     start at level 3; right (0.5+) goes up a level, wrong goes down; a case is six
     items in a row; stop from item 30 once the last ten average 3.5+ or 2.5-, or at 50. */
  var ADAPT = { min: 30, max: 50, caseA: { level: 3, from: 10 }, caseB: { level: 4, from: 20 } };

  function adaptiveInit(items, cfg) {
    var levels = {}, cases = {}, caseOrder = [], byId = {};
    items.forEach(function (it) { byId[it.id] = it; });
    var pc = cfg && cfg.v === 2 ? v2cfg(cfg) : null;
    items.forEach(function (it) {
      if (it.caseId) {
        if (!cases[it.caseId]) { cases[it.caseId] = { id: it.caseId, level: it.level, items: [] }; caseOrder.push(it.caseId); }
        cases[it.caseId].items.push(it.id);
      } else {
        (levels[it.level] = levels[it.level] || []).push(it.id);
      }
    });
    return { levels: levels, cases: cases, caseOrder: caseOrder, byId: byId, list: items, cfg: pc, problems: pc ? validatePool(items, pc) : [] };
  }

  /* delivered: [{id, level, pts, caseId}] in order. Returns {done} or {id, note}. */
  function adaptiveNext(pool, delivered) {
    if (pool.cfg) return adaptiveNext2(pool, delivered);
    var n = delivered.length;
    var used = {}; delivered.forEach(function (d) { used[d.id] = true; });
    var last = delivered[n - 1];

    // inside a case block: carry on to its next item
    if (last && last.caseId) {
      var blk = pool.cases[last.caseId].items;
      var nextInBlock = blk.filter(function (id) { return !used[id]; })[0];
      if (nextInBlock) return { id: nextInBlock };          // a case always runs its six items
    }

    if (n >= ADAPT.max) return { done: true, why: 'max' };

  /* ---------- my rules ---------- */

    out.push(h('h2', null, 'All cards'));
    cards.forEach(function (c) {
      out.push(h('details', { class: 'card' }, h('summary', null, h('b', null, c.front.replace(/\s+/g, ' ').slice(0, 90) + (c.front.length > 90 ? '…' : '')), ' ', h('span', { class: 'pill' }, c.src)),

  /* ---------- progress ---------- */
  function viewProgress() {
    var rows = allResults();
    var out = [h('h1', null, 'Progress')];
    if (!rows.length) { out.push(h('p', null, 'Finish a set and your scores appear here.')); return show(out); }
    var tests = rows.filter(function (r) { return !r.practice; });
    if (tests.length) out.push(chart(tests));
    out.push(h('p', { class: 'small soft' }, 'Scores are on our own original questions. They show the trend and what to work on; they are not a pass prediction.'));

    var cat = {}, type = {};
    S.attempts.forEach(function (a) {
      Object.keys(a.per).forEach(function (id) {
        var it = itemsById[id]; if (!it) return;

    });

    var cats = Object.keys(Object.assign({}, base, cat)).filter(Boolean);
    out.push(h('h2', null, 'By exam category'));
    out.push(h('table', { class: 'plain' }, h('tr', null, h('th', null, ''), h('th', { class: 'n' }, 'Baseline'), h('th', { class: 'n' }, 'In the app')),

        return h('div', { class: 'kv' }, h('span', null, k), h('b', null, fmtPct(100 * type[k].s / type[k].n) + ' of ' + type[k].n));
      })));
    }
    // where she is strong, what needs work, how fast, how sure: from everything done in the app
    var tp = {}, sp = {}, sure = { n: 0, wrong: 0 }, doubt = { n: 0, right: 0 };
    S.attempts.forEach(function (a) {
      Object.keys(a.per).forEach(function (id) {
        var it = itemsById[id]; if (!it) return;
        var t = tp[it.topic] = tp[it.topic] || { s: 0, n: 0 }; t.s += a.per[id]; t.n += 1;
        if (a.times && a.times[id] > 0) { var k = it.calc ? 'Calculations' : it.type === 'multi' ? 'Select-all' : 'Other questions'; var b = sp[k] = sp[k] || { s: 0, n: 0 }; b.s += a.times[id]; b.n += 1; }
        if (a.unsure) { if (a.unsure.indexOf(id) >= 0) { doubt.n++; if (a.per[id] >= 1) doubt.right++; } else { sure.n++; if (a.per[id] < 1) sure.wrong++; } }
      });
    });
    var nice = function (k) { return k.replace(/-/g, ' '); };
    var tk = Object.keys(tp).filter(function (k) { return tp[k].n >= 4; });
    var strongT = tk.filter(function (k) { return tp[k].s / tp[k].n >= 0.8; }), weakT = tk.filter(function (k) { return tp[k].s / tp[k].n < 0.65; });

        h('b', null, 'Strong'), h('div', { class: 'chips', style: 'margin:6px 0 12px' }, strongT.length ? strongT.map(function (k) { return h('span', { class: 'chip done' }, nice(k) + ' ' + Math.round(100 * tp[k].s / tp[k].n) + '%'); }) : h('span', { class: 'small soft' }, 'Building. Keep going.')),
        h('b', null, 'Needs work'), h('div', { class: 'chips', style: 'margin:6px 0 12px' }, weakT.length ? weakT.map(function (k) { return h('span', { class: 'chip' }, nice(k) + ' ' + Math.round(100 * tp[k].s / tp[k].n) + '%'); }) : h('span', { class: 'small soft' }, 'Nothing under 65% right now.')),
        Object.keys(sp).length ? h('div', { class: 'small' }, h('b', null, 'Time per question: '), Object.keys(sp).map(function (k) { return k + ' ' + fmtTime(Math.round(sp[k].s / sp[k].n)); }).join(' · '), h('div', { class: 'soft' }, 'Exam pace is about 1:30 to 2:00.')) : null,
        sure.n + doubt.n >= 15 ? h('div', { class: 'small', style: 'margin-top:10px' }, h('b', null, 'How well you know what you know: '),
          'when you felt sure you were right ' + Math.round(100 * (sure.n - sure.wrong) / Math.max(1, sure.n)) + '% of the time' + (doubt.n >= 4 ? '; when you doubted, you were still right ' + Math.round(100 * doubt.right / doubt.n) + '% of the time.' : '.')) : null,
        h('p', { class: 'small soft' }, 'Your mix and your next sets lean towards "needs work" and keep the strong ones alive.')));
    }
    out.push(h('h2', null, 'Every test'));
    out.push(h('table', { class: 'plain' }, rows.slice().reverse().map(function (r) {
      return h('tr', r.idx !== undefined ? { style: 'cursor:pointer', onclick: function () { go('#result/' + r.idx); } } : null,
        h('td', null, fmtDate(r.date)), h('td', null, r.title, r.old ? h('div', { class: 'small soft' }, 'before the app') : r.practice ? h('div', { class: 'small soft' }, 'practice, not in the chart') : null),
        h('td', { class: 'n' }, h('b', null, fmtPct(r.pct)), h('div', { class: 'small soft' }, fmtPts(r.score) + '/' + r.max)));
    })));

  }
  function chart(rows) {
    var W = 320, H = 160, L = 30, R = 12, T = 22, B = 22, n = rows.length;
    var x = function (i) { return L + (n === 1 ? (W - L - R) / 2 : i * (W - L - R) / (n - 1)); };
    var y = function (p) { return T + (100 - p) * (H - T - B) / 100; };

    var el = function (tag, at, text) { var e = document.createElementNS(ns, tag); Object.keys(at).forEach(function (k) { e.setAttribute(k, at[k]); }); if (text) e.textContent = text; svg.appendChild(e); return e; };
    [0, 50, 100].forEach(function (p) {
      el('line', { x1: L, x2: W - R, y1: y(p), y2: y(p), stroke: 'var(--line)', 'stroke-width': 1 });
      el('text', { x: L - 5, y: y(p) + 4, 'text-anchor': 'end', 'font-size': 10, fill: 'var(--soft)' }, p + '%');
    });
    if (n > 1) el('polyline', { points: rows.map(function (r, i) { return x(i) + ',' + y(r.pct); }).join(' '), fill: 'none', stroke: 'var(--accent)', 'stroke-width': 2 });
    rows.forEach(function (r, i) {
      el('circle', { cx: x(i), cy: y(r.pct), r: 4, fill: 'var(--accent)' });
      el('text', { x: x(i), y: y(r.pct) - 8, 'text-anchor': 'middle', 'font-size': 10, fill: 'var(--ink)' }, Math.round(r.pct));
    });
    el('text', { x: L, y: H - 5, 'font-size': 10, fill: 'var(--soft)' }, fmtDate(rows[0].date));
    el('text', { x: W - R, y: H - 5, 'text-anchor': 'end', 'font-size': 10, fill: 'var(--soft)' }, fmtDate(rows[n - 1].date));
    return h('div', { class: 'card' }, svg);
  }

  /* ---------- plan and coverage ---------- */
  function viewPlan() {

        h('div', { class: 'grow' }, h('b', null, q.t + ' · ' + q.title), h('div', { class: 'small soft' }, 'Saunders ' + q.saunders + (sets.length ? ' · ' + sets.length + (sets.length === 1 ? ' set' : ' sets') : ''))), cb),

      var n = g.areas.filter(isDone).length;
      out.push(h('details', { class: 'card' }, h('summary', null, h('b', null, g.group), h('span', { class: 'soft small' }, '  ' + n + ' of ' + g.areas.length)),
        h('div', { class: 'chips', style: 'margin-top:10px' }, g.areas.map(function (ar) { return h('span', { class: 'chip' + (isDone(ar) ? ' done' : '') }, ar.name + ' · ' + ar.t.join('/')); }))));
    });
    show(out);
  }

  /* ---------- more: exam date, sending, backup ---------- */
  function viewMore() {
    var out = [h('h1', null, 'More')];
    var date = h('input', { type: 'date', value: S.exam || '', 'aria-label': 'Exam date', onchange: function () { S.exam = date.value || null; save(); toast('Saved'); } });
    out.push(h('div', { class: 'card' }, h('h3', { style: 'margin-top:0' }, 'Exam date'), date));

    var unsent = S.attempts.filter(function (a) { return !a.sent; });
    out.push(h('div', { class: 'card stack' }, h('h3', { style: 'margin-top:0' }, 'Send results to Nova'),
      h('p', { class: 'small soft' }, 'Nova keeps the second copy of your record and uses it to choose your next set.'),
      unsent.length
        ? h('button', { onclick: function () { sendText(unsent.map(resultMessage).join('\n\n'), function () { unsent.forEach(function (a) { a.sent = true; }); save(); route(); }); } }, 'Send ' + unsent.length + (unsent.length === 1 ? ' result' : ' results'))
        : h('p', null, 'Everything is sent.')));

    var ta = h('textarea', { 'aria-label': 'Backup code', placeholder: 'Paste a backup code here to restore' });
    out.push(h('div', { class: 'card stack' }, h('h3', { style: 'margin-top:0' }, 'Backup'),
      h('p', { class: 'small soft' }, 'Your answers live on this phone. If you change phone or clear Safari, a backup code puts everything back. Nova can also send you one.'),
      h('button', { class: 'ghost', onclick: function () { sendText('My study backup:\n' + backupCode()); } }, 'Make a backup code'),
      ta,
      h('button', { class: 'ghost', onclick: function () { try { restore(ta.value); toast('Restored'); go('#home'); } catch (e) { toast('That code did not work'); } } }, 'Restore from code')));
    out.push(h('p', { class: 'small soft center' }, 'Questions updated ' + fmtDate(D.built) + ' · ' + BANK.items.length + ' questions in ' + BANK.sets.length + ' sets'));
    out.push(h('p', { class: 'small soft center' }, 'Original practice questions for study only. Not real exam items; follow your facility protocol in practice.'));
    show(out);
  }
  function backupCode() { return 'RB1.' + C.b64uEncode(JSON.stringify(S)); }
  /* Restore never throws away what is on this phone: results are merged by their finish time. */
  function restore(code) {
    var m = String(code).match(/RB1\.([A-Za-z0-9_-]+)/);

    if (obj.hist) { S.hist = obj.hist; HIST = obj.hist; }
    if (!S.exam && obj.exam) S.exam = obj.exam;
    S.attempts.forEach(remark);
    save();
  }

  /* ---------- routing ---------- */
  var TABS = [['home', '⌂', 'Today'], ['sets', '☰', 'Practice'], ['learn', '✎', 'Learn'], ['progress', '↗', 'Progress'], ['plan', '✓', 'Plan']];
  function route() {

    var hash = location.hash.replace(/^#/, '') || 'home';
    var parts = hash.split('/'), page = parts[0], arg = parts[1] ? decodeURIComponent(parts.slice(1).join('/')) : null;
    if (page === 'restore' && arg) {

      history.replaceState(null, '', location.pathname); page = 'home';

    var nav = document.querySelector('nav.tabs');

    Array.prototype.forEach.call(nav.querySelectorAll('a'), function (a) {
      var on = a.getAttribute('href') === '#' + (page === 'set' ? 'sets' : page === 'lesson' || page === 'pic' || page === 'rules' ? 'learn' : page === 'result' ? 'progress' : page === 'more' ? 'home' : page);

    ({ home: viewHome, sets: viewSets, set: function () { viewSet(arg); }, run: function () { viewRun(arg); },
       result: function () { viewResult(parseInt(arg, 10)); }, lesson: function () { viewLesson(arg); }, learn: viewLearn, pic: function () { viewPicture(arg); }, welcome: function () { viewWelcome(0); }, rules: viewRules, progress: viewProgress, plan: viewPlan, more: viewMore }[page] || viewHome)();

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
